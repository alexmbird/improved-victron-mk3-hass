set_remote_panel_state:
  name: set_remote_panel_state
  description: "Sets the remote panel mode and current limit."
  fields:
    device_id:
      name: Target
      description: ""
      selector:
        device:
          filter:
            integration: "victron_mk3"
    mode:
      name: Mode
      description: Desired operation mode
      selector:
        select:
          options:
            - "off"
            - "on"
            - charger_only
            - inverter_only
    current_limit:
      name: Current limit
      description: AC input current limit in amps
      selector:
        number:
          min: 0
          max: 100
          step: any
          mode: box
    keep_current_limit:
      name: Keep current limit
      description: Keep the device's actual AC input current limit. Defaults to true when current limit is not given. Setting it to false without a current limit resets the limit to the device maximum. Cannot be used with current limit.
      selector:
        boolean:
